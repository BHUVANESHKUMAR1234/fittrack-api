name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fittrack_test
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        env:
          DB_URL: jdbc:postgresql://localhost:5432/fittrack_test
          DB_USERNAME: fittrack
          DB_PASSWORD: fittrack
          JWT_SECRET: Zm10dHJhY2stdGVzdC1zZWNyZXQta2V5LWZvci1jaS10ZXN0aW5nLW9ubHk=
        run: mvn clean verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fittrack-api:${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker tag fittrack-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fittrack-api:${{ github.sha }}
          docker tag fittrack-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fittrack-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fittrack-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/fittrack-api:latest
