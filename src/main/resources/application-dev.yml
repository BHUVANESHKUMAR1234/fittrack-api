spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:fittrack_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
    username: sa
    password: 
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.H2Dialect
      default_schema: PUBLIC
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql

logging:
  level:
    com.fittrack: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
