apiVersion: apps/v1
kind: Deployment
metadata:
  name: fittrack-api
  namespace: fittrack
  labels:
    app: fittrack-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fittrack-api
  template:
    metadata:
      labels:
        app: fittrack-api
    spec:
      containers:
        - name: fittrack-api
          image: bhuvaneshkumar1234/fittrack-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fittrack-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fittrack-api-svc
  namespace: fittrack
spec:
  selector:
    app: fittrack-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fittrack-api-hpa
  namespace: fittrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fittrack-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
